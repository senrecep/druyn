<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
    <meta charset="UTF-8">
    <!-- make responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Druyn</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">

    <!-- Bulma overrides -->
    <style>
        /* Warm up all of default greys */
        :root {
            --bulma-scheme-h: 35;
            --bulma-scheme-s: 10%;
        }

        /* Get hyper link underline back */
        a {
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }

        /* Make titles semibold */
        .title {
            --bulma-title-weight: 600;
        }
    </style>

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/images/icon.svg">
    <!--link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png"-->
</head>
<body>

    <div class="hero is-fullheight is-dark">
        <div class="hero-body">

            
    <div class="container has-text-centered">
        <div class="columns is-centered">
            <div class="column is-5 is-4-desktop">
                <img src="/images/icon.svg" width="100" height="100">

                <!-- Heading -->
                <h1 class="title is-3 is-spaced has-text-white">Bei Druyn anmelden</h1>

                <div class="notification is-danger is-light is-invisible" 
    style="height: 2.2rem; display: flex; align-items: center;">
    <button class="delete" type="button" onclick="this.parentElement.classList.add('is-invisible')"></button>
    <p class="is-size-7">
        &amp;nbsp;
    </p>
</div>

                <!-- Input form -->
                <div class="box has-text-left">
                    <form action="" method="post">

                        <div class="field">
    <label class="label is-small">E-Mail-Adresse</label>
    <div class="control">
        <input class="input" type="email" autocomplete="username" 
               name="user_email" value="" 
               maxlength="130" required>
    </div>
</div>
                        
                        <div class="field">
                            <div class="is-flex is-justify-content-space-between is-align-items-baseline">
                                <label class="label is-small">Passwort</label>
                                <a class="is-size-7 has-text-link" href="/forgot-password">
                                    Passwort vergessen?
                                </a>
                            </div>

                            <div class="control">
                                <input class="input" type="password" autocomplete="current-password" name="password" minlength="11" maxlength="71" required> <!-- Change the minlength to 12 -->
                            </div>
                        </div>
                        <div class="field">
                            <button class="button is-primary is-fullwidth">Anmelden</button>
                        </div>
                        <p class="has-text-centered">
                            Neu bei Druyn?
                            <a class="has-text-link" href="/signup">Konto erstellen</a>
                        </p>
                    </form>
                </div>

            </div>
        </div>
    </div>

            
        </div>
    </div>

</body>
</html>
