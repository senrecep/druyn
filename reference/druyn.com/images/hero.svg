<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1920 1080"
  preserveAspectRatio="xMidYMid slice"
>
  <defs>
    <!-- Background gradient -->
    <linearGradient id="skyGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="35%" stop-color="#0B1B5A" />
      <stop offset="70%" stop-color="#4C1D95" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Nebula glow -->
    <radialGradient id="nebula1" cx="50%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="nebula2" cx="20%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>

    <!-- Star glow -->
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#skyGradient)" />

  <!-- Soft nebula layers -->
  <rect width="1920" height="1080" fill="url(#nebula1)" />
  <rect width="1920" height="1080" fill="url(#nebula2)" />

  <!-- Small stars -->
  <g fill="white" opacity="0.85">
    <circle cx="120" cy="80" r="1.5" />
    <circle cx="260" cy="180" r="1.2" />
    <circle cx="400" cy="90" r="1.4" />
    <circle cx="580" cy="220" r="1.1" />
    <circle cx="760" cy="140" r="1.8" />
    <circle cx="920" cy="260" r="1.2" />
    <circle cx="1100" cy="110" r="1.4" />
    <circle cx="1280" cy="210" r="1.1" />
    <circle cx="1450" cy="80" r="1.7" />
    <circle cx="1620" cy="190" r="1.3" />
    <circle cx="1780" cy="120" r="1.6" />

    <circle cx="180" cy="320" r="1.2" />
    <circle cx="520" cy="340" r="1.0" />
    <circle cx="840" cy="380" r="1.3" />
    <circle cx="1180" cy="330" r="1.1" />
    <circle cx="1540" cy="360" r="1.4" />
    <circle cx="1710" cy="280" r="1.0" />
  </g>

  <!-- Bright glowing stars -->
  <g fill="#A5F3FC" filter="url(#starGlow)">
    <circle cx="300" cy="140" r="3" />
    <circle cx="980" cy="170" r="2.5" />
    <circle cx="1500" cy="220" r="3.5" />
    <circle cx="1720" cy="90" r="2.8" />
    <circle cx="680" cy="260" r="2.4" />
  </g>

  <!-- Optional horizon glow -->
  <rect
    x="0"
    y="760"
    width="1920"
    height="320"
    fill="#EC4899"
    opacity="0.08"
  />
</svg>